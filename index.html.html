<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Insert</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>MEDIA SOURCE</h2>
    <hr>

    <div class="content">
        <h3>Image</h3>
        <p>Insertion of Image</p>

        <img src="minion.jpg" alt="Minions Cartoon" height="2" width="16">
        <img src="Kevin.jpg" alt="Minions Cartoon" height="2" width="16">
        <img src="Stuart.jpg" alt="Minions Cartoon" height="2" width="16">
    </div>

    <div class="content">
        <h3>Audio</h3>
        <p>Insertion of Audio</p>

        <audio controls>
           <source src="The Minions Sing I Swear Audio.mp3" type="audio/mpeg">
        </audio>         
    </div>

    <div class="content">
        <h3>Video</h3>
        <p>Insertion of Video</p>

        <video controls>
              <source src="The Minions Sing I Swear.mp4" type="video/mp4">
        </video>
    </div>
    
    
    
</body>
</html>
